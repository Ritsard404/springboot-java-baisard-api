# ============================================================================
# Application
# ============================================================================
spring.application.name=baisard
spring.application.version=@version@
spring.info.app.description=@description@
spring.info.app.encoding=@sourceEncoding@
spring.info.app.java.version=@java.version@

# Default profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.profiles.include=secret

# ============================================================================
# Server Configuration
# ============================================================================
server.port=1234
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.forward-headers-strategy=native

# Session timeout & cookies
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ============================================================================
# Datasource (PostgreSQL)
# ============================================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# JPA & Hibernate
# ============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# JDBC batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# ============================================================================
# Swagger
# ============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================================
# Security
# ============================================================================
aes.secretKey=wotkdvu@fcz1246GsJwlddutn_dlswndtlrtkgud

# ============================================================================
# File Upload
# ============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.location=/app

