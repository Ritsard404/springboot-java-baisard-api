# ============================================================================
# PROD Environment (Blue-Green Deployment)
# ============================================================================
server.port=1234
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# File upload
app.upload.base-directory=/app
app.upload.max-file-size=100MB
app.upload.max-request-size=200MB

# Cookies
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.domain=.demo.com

# Actuator for Blue-Green health check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=WARN
logging.level.com.lodong=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.file.name=/var/log/demo/application.log
logging.logback.rollingpolicy.file-name-pattern=/var/log/demo/application-%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=3GB
logging.logback.rollingpolicy.clean-history-on-start=false

# Error pages
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Redis
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5
spring.data.redis.jedis.pool.max-wait=-1ms

# Tomcat
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${TOMCAT_MIN_THREADS:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:10000}
server.tomcat.connection-timeout=20000

# Features & monitoring
app.feature.debug-mode=false
app.feature.maintenance-mode=false
app.monitoring.enabled=true
app.monitoring.metrics.export.enabled=true
app.monitoring.alert.enabled=true

# Bean overriding
spring.main.allow-bean-definition-overriding=true